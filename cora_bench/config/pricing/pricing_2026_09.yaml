version: pricing_2026_09
# USD per 1M tokens (API models) and USD per GPU-hour (self-hosted). Update by adding a new
# versioned file rather than editing in place; runs record which version they used.
# `*_long` rates apply to the whole request once input tokens exceed long_context_threshold.

models:
  gemini-3.1-pro-preview:
    input_per_1m: 2.00
    output_per_1m: 12.00
    long_context_threshold: 200000
    input_per_1m_long: 4.00
    output_per_1m_long: 18.00
  gemini-3-flash-preview:
    input_per_1m: 0.50
    output_per_1m: 3.00
  gemini-3.5-flash-lite:
    input_per_1m: 0.30
    output_per_1m: 2.50
  gpt-4o-mini:
    input_per_1m: 0.15
    output_per_1m: 0.60

# GCP on-demand GPU list price (us-central1), USD/hour. Preemptible is ~1/3; record the
# actual provisioning model per run in the manifest.
gpu_hourly:
  "Tesla T4": 0.35
  "NVIDIA L4": 0.71
  "NVIDIA A100-SXM4-40GB": 3.67
  "NVIDIA A100 40GB": 3.67
